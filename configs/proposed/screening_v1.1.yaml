# a scene not used by the retained tasks (R5): LIVING_ROOM_SCENE3 (freed by 56) and KITCHEN_SCENE1 (unused by v1.0).
# 55/57/58/59 keep the removed task's category (container); 6-10 would change the R6 quota and need
