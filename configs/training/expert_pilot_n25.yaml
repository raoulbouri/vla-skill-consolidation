# Action-expert-only pilot on t42 (n25): Gemma 2B + SigLIP frozen, the 300M expert (+ action projections, time MLP)
# fully trained. 2000 steps with held-out val loss every 250 steps, to pick the step budget for the 10-task runs.
schema_version: 1
name: expert-pilot-n25
kind: specialists
budget_approved: true
manifest: configs/task_manifest.yaml
control_tasks:
- 56
data_config: configs/datasets/processed_v1.yaml
data_split_profile: n25
model:
  base_openpi_config: pi05_libero
  mode: expert
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  freeze_vision_encoder: true
optim:
  peak_lr: 5.0e-05
  warmup_steps: 100
  decay_steps: 2000
  decay_lr: 5.0e-06
  clip_gradient_norm: 1.0
train:
  num_steps: 2000
  batch_size: 8
  num_workers: 2
  log_interval: 50
  val_interval: 250
  val_max_batches: 50
  save_interval: 2000
gates:
  max_loss: 1.0e4
runtime:
  xla_mem_fraction: 0.92
